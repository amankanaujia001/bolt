<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bolttech Final Prototypes</title>
  <style>
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f7fb;margin:0;color:#102033}
    .wrap{max-width:900px;margin:0 auto;padding:70px 24px}
    .hero{background:linear-gradient(135deg,#101d42,#2742b2 58%,#4263ff);color:white;border-radius:28px;padding:44px;box-shadow:0 18px 45px rgba(15,23,42,.2)}
    h1{font-size:44px;line-height:1.05;margin:0 0 12px;letter-spacing:-.04em}
    p{font-size:18px;color:rgba(255,255,255,.86);line-height:1.5}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
    a{display:block;background:white;border:1px solid #d9e2ef;border-radius:20px;padding:24px;text-decoration:none;color:#102033;box-shadow:0 10px 28px rgba(15,23,42,.06)}
    a strong{display:block;font-size:22px;margin-bottom:6px}
    a span{color:#64748b}
    @media(max-width:720px){.cards{grid-template-columns:1fr}.hero{padding:30px}h1{font-size:34px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>bolttech Results Page Prototypes</h1>
      <p>Final mobile and web HTML prototypes for the insurance Results Page redesign.</p>
    </div>
    <div class="cards">
      <a href="mobile.html"><strong>Open Mobile Prototype</strong><span>Mobile-first Results Page experience</span></a>
      <a href="web.html"><strong>Open Web Prototype</strong><span>Desktop/web Results Page experience</span></a>
    </div>
  </div>
</body>
</html>
